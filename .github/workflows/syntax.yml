name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n SSH-Hardening.sh

      - name: Run ShellCheck
        run: shellcheck --severity=warning -x SSH-Hardening.sh

      - name: Verify release checksum
        run: sha256sum -c SSH-Hardening.sh.sha256
